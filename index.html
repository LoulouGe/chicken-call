<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken Call</title>
    <meta
      name="description"
      content="Chicken Call, un mini-jeu d'anglais jouable dans un site statique GitHub Pages."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./assets/poule.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-glow page-glow-a"></div>
    <div class="page-glow page-glow-b"></div>
    <div class="page-shell">
      <main class="game-layout">
        <section class="board-wrap">
          <div id="gameBoard" class="board" aria-label="Aire de jeu Chicken Call">
            <div class="board-hud">
              <div class="instruction-banner">
                <p id="promptText" class="instruction-text">Charge les bonnes poules.</p>
              </div>
              <div class="heart-hud" aria-label="Erreurs restantes">
                <div class="heart-slot"><span class="life-heart" data-heart="0">♥</span></div>
                <div class="heart-slot"><span class="life-heart" data-heart="1">♥</span></div>
                <div class="heart-slot"><span class="life-heart" data-heart="2">♥</span></div>
              </div>
            </div>
            <div class="sr-metrics" aria-hidden="true">
              <span id="targetWords"></span>
              <span id="remainingText">0</span>
              <span id="stackText">0</span>
              <span id="mistakeText">0</span>
            </div>
            <div class="board-frame"></div>
            <div class="sky-layer"></div>
            <div class="cloud cloud-a"></div>
            <div class="cloud cloud-b"></div>
            <div class="cloud cloud-c"></div>
            <div class="hill hill-a"></div>
            <div class="hill hill-b"></div>
            <div class="hill hill-c"></div>
            <div class="tree tree-a"></div>
            <div class="tree tree-b"></div>
            <div class="tree tree-c"></div>
            <div class="ground"></div>
            <div class="field-track"></div>
            <div class="fence fence-a"></div>
            <div class="fence fence-b"></div>
            <div class="barn-shadow"></div>
            <div id="coop" class="coop" aria-hidden="true">
              <div class="coop-roof"></div>
              <div class="coop-body">
                <div class="coop-sign">Henhouse</div>
                <div class="coop-door"></div>
              </div>
            </div>
            <div id="player" class="player" aria-hidden="true">
              <div class="stack-anchor" id="stackAnchor"></div>
              <div class="player-shadow"></div>
              <div class="player-body">
                <div class="player-head"></div>
                <div class="player-torso"></div>
              </div>
            </div>
            <div id="messageBubble" class="message-bubble hidden" aria-live="polite"></div>
            <div id="flashText" class="flash-text hidden" aria-live="polite"></div>
          </div>

          <div class="touch-bar">
            <div class="mobile-controls">
              <div class="joystick-shell">
                <div id="joystickBase" class="joystick-base">
                  <div id="joystickKnob" class="joystick-knob"></div>
                </div>
              </div>
              <div class="mobile-actions">
                <button id="pickupButton" class="touch-action pickup-action" type="button">Prendre</button>
                <button id="dropButton" class="touch-action drop-action" type="button">Deposer</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-card">
        <div class="overlay-medal" aria-hidden="true"></div>
        <p class="overlay-kicker">Apprenti fermier</p>
        <h2 id="overlayTitle">Ramène les bonnes poules au poulailler</h2>
        <p id="overlayText">
          Approche-toi d'une poule pour entendre son mot en anglais, prends-la avec E puis
          dépose toutes les bonnes réponses dans le poulailler.
        </p>
        <div id="resultPanel" class="result-panel hidden">
          <p id="resultLabel" class="result-label">Victoire</p>
          <div id="overlayStars" class="overlay-stars" aria-label="Score en étoiles"></div>
        </div>
        <button id="overlayButton" class="primary-button big-button" type="button">Commencer</button>
      </div>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
